<VirtualHost *:8082>
    ServerAdmin nateponds.com
    ServerName nateponds.com
    ServerAlias www.nateponds.com

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^nateponds\.com$ [NC]
    RewriteRule ^ https://nateponds.com%{REQUEST_URI} [R=301,L,NE]
    RewriteCond %{HTTP:X-Forwarded-Proto} !^https$ [NC]
    RewriteRule ^ https://nateponds.com%{REQUEST_URI} [R=301,L,NE]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3010/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:3010/

    Header always unset X-Powered-By
    Header always unset X-Served-By

    ErrorLog ${APACHE_LOG_DIR}/portfolio_error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio_access.log combined
</VirtualHost>
